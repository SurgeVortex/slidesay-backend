repos:
  # Pre-commit hooks - standard utilities
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Python code formatting - Black
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3.13
        args: []

  # Import sorting - isort
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Ruff - Fast Python linter and formatter (replaces flake8, pylint, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff

  # Type checking - mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        args:
          [
            --ignore-missing-imports,
            --strict-optional,
            --explicit-package-bases,
          ]
        additional_dependencies:
          - types-requests>=2.32.0

  # Security scanning - Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        args: ["-r", "src/", "-ll"]
        pass_filenames: false
        exclude: ^(\.venv/|\.env/|venv/|env/|\.eggs/)

  # YAML/JSON formatting - Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        exclude: ^(\.venv/|\.github/workflows/)

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Run detect-secrets with default behaviour for new projects
        args: []
        exclude: ^(\.venv/|node_modules/|package-lock.json)

  # Azure-specific checks
  - repo: local
    hooks:
      - id: check-azure-settings
        name: Check Azure Function settings
        entry: python scripts/check_azure_settings.py
        language: python
        files: '^(host\.json|local\.settings\.json\.template)$'

      - id: validate-grafana-dashboards
        name: Validate Grafana dashboard JSON
        entry: python scripts/validate_grafana_config.py
        language: python
        files: '^grafana/.*\.json$'
