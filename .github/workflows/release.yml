name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use the repo token; create-release requires contents: write above
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

      - name: Attach artifacts to release (if created)
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release created: ${{ steps.release.outputs.tag_name }}"
