name: Automated Dependency Updates

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-dependencies:
    runs-on: self-hosted
    name: Update Python Dependencies

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools

    - name: Update dependencies with pip-compile
      run: |
        # Compile requirements files with latest compatible versions
        pip-compile --upgrade --resolver=backtracking requirements.in
        pip-compile --upgrade --resolver=backtracking requirements-dev.in

    - name: Run security check on updated dependencies
      run: |
        pip install safety
        safety check -r requirements.txt || echo "Security issues found"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update Python dependencies"
        title: "chore: automated dependency updates"
        body: |
          ## Automated Dependency Updates

          This PR updates Python dependencies to their latest compatible versions.

          ### Changes
          - Updated dependencies in requirements.txt
          - Updated dev dependencies in requirements-dev.txt

          ### Testing
          Please verify:
          - [ ] All tests pass
          - [ ] No security vulnerabilities introduced
          - [ ] Application functions correctly

          Generated by automated dependency update workflow.
        branch: automated-dependency-updates
        delete-branch: true
        labels: dependencies, automated

  update-github-actions:
    runs-on: self-hosted
    name: Update GitHub Actions

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update GitHub Actions versions
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // Read all workflow files
          const workflowsDir = '.github/workflows';
          const files = fs.readdirSync(workflowsDir);

          let updated = false;
          for (const file of files) {
            if (file.endsWith('.yml') || file.endsWith('.yaml')) {
              const filePath = path.join(workflowsDir, file);
              let content = fs.readFileSync(filePath, 'utf8');

              // Update common actions to latest versions (simple regex replacement)
              const updates = {
                'actions/checkout@v4': 'actions/checkout@v4',
                'actions/setup-python@v4': 'actions/setup-python@v5',
                'actions/cache@v3': 'actions/cache@v4',
                'actions/upload-artifact@v3': 'actions/upload-artifact@v4',
                'actions/download-artifact@v3': 'actions/download-artifact@v4',
              };

              let fileUpdated = false;
              for (const [pattern, replacement] of Object.entries(updates)) {
                if (content.includes(pattern) && pattern !== replacement) {
                  content = content.replace(new RegExp(pattern, 'g'), replacement);
                  fileUpdated = true;
                }
              }

              if (fileUpdated) {
                fs.writeFileSync(filePath, content);
                updated = true;
              }
            }
          }

          return updated;

    - name: Create Pull Request for GitHub Actions updates
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update GitHub Actions versions"
        title: "chore: update GitHub Actions to latest versions"
        body: |
          ## GitHub Actions Updates

          This PR updates GitHub Actions to their latest versions.

          ### Changes
          - Updated action versions in workflow files

          Generated by automated GitHub Actions update workflow.
        branch: automated-actions-updates
        delete-branch: true
        labels: dependencies, github-actions, automated
