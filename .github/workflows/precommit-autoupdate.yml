name: Update pre-commit hooks

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday at 03:00 UTC
  workflow_dispatch: {}

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit autoupdate
        id: autoupdate
        run: |
          pre-commit autoupdate
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-config.yaml || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update pre-commit hooks" || echo "no changes to commit"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.autoupdate.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: auto-update pre-commit hooks"
          title: "chore: update pre-commit hooks"
          body: |
            This PR was opened automatically by the scheduled workflow to update pre-commit hook revisions.
            Please review and merge if the changes are acceptable.
          labels: automated,dependencies
          branch: chore/precommit-autoupdate
